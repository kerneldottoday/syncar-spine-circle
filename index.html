<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncAR Spine — Surgical Theater</title>

  <!-- Montserrat replaces Inter for all display text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* ── Toggle background button (visible on page, not part of scene) ── */
    #bg-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 9999;
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 7px 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s, color 0.2s;
      user-select: none;
    }
    #bg-toggle:hover {
      background: rgba(255,255,255,0.14);
      color: #ffffff;
    }
    /* Transparent state indicator */
    #bg-toggle.is-transparent {
      border-color: rgba(255,255,255,0.45);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="scene">

    <!-- ── PARTICLE LAYER ──────────────────────────────────── -->
    <canvas id="bg-particles"></canvas>

    <!-- ── SVG DIAGRAM ──────────────────────────────────────── -->
    <!--
      Circle geometry matching AiBLE Smart Ecosystem reference
        Canvas      : 1920 × 1080   Centre: (960, 540)
        Outer r     : 250px
        Inner r     : 125px   →  Ring : 125px  (25% of ⌀500 = matches reference)
        Inner/Outer : 50% — large centre circle, as in AiBLE
        Text/Sweep r: 188px   (exact midline 187.5, rounded)
        Arc length  : 188 × 115° × π/180 ≈ 377px
        Dasharray   : 65 + 312 = 377   Offset: 65 → −312
        Gap : 5°  /  Span : 115°

      Angles  (0°=right, 90°=down, CW+)
        Seg 1  Pre-Operative     : −87.5° →  27.5°
        Seg 2  Patient Engagement:  32.5° → 147.5°
        Seg 3  Intra-Operative   : 152.5° → 267.5°

      Trig constants
        cos/|sin|(±87.5°): 0.04362 / 0.99905
        cos/sin(27.5°):    0.88701 / 0.46175
        cos/sin(32.5°):    0.84339 / 0.53730
    -->
    <svg id="diagram"
         viewBox="0 0 1920 1080"
         width="1920" height="1080"
         overflow="visible"
         xmlns="http://www.w3.org/2000/svg">

      <defs>

        <!-- ── Glow filters — start invisible, animated by GSAP ── -->
        <filter id="glow-red" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="20"
            flood-color="#E8163A" flood-opacity="0.9"/>
        </filter>
        <filter id="glow-purple" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="18"
            flood-color="#9B30FF" flood-opacity="0.85"/>
        </filter>
        <filter id="glow-gold" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="20"
            flood-color="#F0B400" flood-opacity="0.9"/>
        </filter>

        <!-- Circular clip for centre video  r=200 (2× original 100) -->
        <clipPath id="circle-clip">
          <circle cx="960" cy="540" r="200"/>
        </clipPath>

        <!-- Vignette gradient for centre circle -->
        <radialGradient id="vignette-grad" cx="50%" cy="50%" r="50%">
          <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.88"/>
        </radialGradient>

        <!-- ══════════════════════════════════════════════════
             Gap mask — 2× scale  r_outer=504  r_inner=246
             6° wedges (267°→273°, 27°→33°, 147°→153°)
             All coords: x_new = 2x−960, y_new = 2y−540
             ══════════════════════════════════════════════════ -->
        <mask id="ring-gaps-mask">
          <rect x="0" y="0" width="1920" height="1080" fill="white"/>

          <!-- Gap A  top  267°→273° -->
          <path fill="black"
            d="M 933.62,36.70 A 504,504 0 0,1 986.38,36.70
               L 972.88,294.34 A 246,246 0 0,0 947.12,294.34 Z"/>

          <!-- Gap B  right  27°→33° -->
          <path fill="black"
            d="M 1409.06,768.82 A 504,504 0 0,1 1382.68,814.50
               L 1166.32,673.98 A 246,246 0 0,0 1179.18,651.68 Z"/>

          <!-- Gap C  left  147°→153° -->
          <path fill="black"
            d="M 537.32,814.50 A 504,504 0 0,1 510.94,768.82
               L 740.82,651.68 A 246,246 0 0,0 753.68,673.98 Z"/>
        </mask>

        <!-- ══════════════════════════════════════════════════
             Text-path arcs  r = 424  (2× original 212)
             Arc length: 424 × 2.0071 ≈ 851px — fits all labels
             at 30px/3px letter-spacing with ample headroom.
             All coords: x_new = 2x−960, y_new = 2y−540
             ══════════════════════════════════════════════════ -->

        <!-- tpath-1  CCW  27.5°→272.5°  (PRE-OPERATIVE — chars face upward) -->
        <path id="tpath-1"
          d="M 1336.10,735.78 A 424,424 0 0,0 978.50,116.40"/>

        <!-- tpath-2  CCW  147.5°→32.5°  (PATIENT ENGAGEMENT — L→R through bottom) -->
        <path id="tpath-2"
          d="M 602.40,767.82 A 424,424 0 0,0 1317.60,767.82"/>

        <!-- tpath-3  CW  152.5°→267.5°  (INTRA-OPERATIVE — readable upward) -->
        <path id="tpath-3"
          d="M 583.90,735.78 A 424,424 0 0,1 941.50,116.40"/>

      </defs>

      <!-- ══════════════════════════════════════════════════════
           ARC SEGMENTS  outer r=500  inner r=250  ring=250px
           2× scale — fills nearly full 1080px height
           ══════════════════════════════════════════════════════ -->
      <g mask="url(#ring-gaps-mask)">

      <!-- Seg 1 — Pre-Operative  (−87.5° → 27.5°)  2× coords -->
      <path id="seg-1" class="segment"
        d="M 981.82,40.48
           A 500,500 0 0,1 1403.50,770.86
           L 1181.76,655.44
           A 250,250 0 0,0  970.90,290.24
           Z"
        fill="#4d1020"
        data-mute="#4d1020"
        data-active="#E8163A"
        data-filter="glow-red"
        cursor="pointer"/>

      <!-- Seg 2 — Patient Engagement  (32.5° → 147.5°)  2× coords -->
      <path id="seg-2" class="segment"
        d="M 1381.70,808.66
           A 500,500 0 0,1  538.30,808.66
           L  749.16,674.32
           A 250,250 0 0,0 1170.84,674.32
           Z"
        fill="#2e1260"
        data-mute="#2e1260"
        data-active="#9B30FF"
        data-filter="glow-purple"
        cursor="pointer"/>

      <!-- Seg 3 — Intra-Operative  (152.5° → 267.5°)  2× coords -->
      <path id="seg-3" class="segment"
        d="M  516.50,770.86
           A 500,500 0 0,1  938.18,40.48
           L  949.10,290.24
           A 250,250 0 0,0  738.24,655.44
           Z"
        fill="#3d3000"
        data-mute="#3d3000"
        data-active="#F0B400"
        data-filter="glow-gold"
        cursor="pointer"/>

      </g><!-- /ring-gaps-mask -->

      <!-- ── GAP COVERS — belt-and-suspenders black fills (2× scale) ── -->
      <path class="gap-cover"
        d="M 933.62,36.70 A 504,504 0 0,1 986.38,36.70
           L 972.88,294.34 A 246,246 0 0,0 947.12,294.34 Z"/>
      <path class="gap-cover"
        d="M 1409.06,768.82 A 504,504 0 0,1 1382.68,814.50
           L 1166.32,673.98 A 246,246 0 0,0 1179.18,651.68 Z"/>
      <path class="gap-cover"
        d="M 537.32,814.50 A 504,504 0 0,1 510.94,768.82
           L 740.82,651.68 A 246,246 0 0,0 753.68,673.98 Z"/>

      <!-- ── ARC LABELS ─────────────────────────────────────── -->
      <text class="arc-label" id="label-1">
        <textPath href="#tpath-1" startOffset="50%" text-anchor="middle">PRE-OPERATIVE</textPath>
      </text>

      <text class="arc-label" id="label-2">
        <textPath href="#tpath-2" startOffset="50%" text-anchor="middle">PATIENT ENGAGEMENT</textPath>
      </text>

      <text class="arc-label" id="label-3">
        <textPath href="#tpath-3" startOffset="50%" text-anchor="middle">INTRA-OPERATIVE</textPath>
      </text>

      <!-- ══════════════════════════════════════════════════════
           ARC SWEEP OVERLAYS  r=376 (2×188)  stroke-width=245 (CSS)
           arc length 376×2.0071≈755  dasharray 130+624=754
           ══════════════════════════════════════════════════════ -->

      <!-- sweep-1  CW  −87.5°→27.5° -->
      <path id="sweep-1" class="arc-sweep"
        d="M 976.40,164.36 A 376,376 0 0,1 1293.52,713.62"
        stroke-dasharray="130 624" stroke-dashoffset="130"/>

      <!-- sweep-2  CW  32.5°→147.5° -->
      <path id="sweep-2" class="arc-sweep"
        d="M 1277.12,742.02 A 376,376 0 0,1 642.88,742.02"
        stroke-dasharray="130 624" stroke-dashoffset="130"/>

      <!-- sweep-3  CW  152.5°→267.5° -->
      <path id="sweep-3" class="arc-sweep"
        d="M 626.48,713.62 A 376,376 0 0,1 943.60,164.36"
        stroke-dasharray="130 624" stroke-dashoffset="130"/>

      <!-- ── CENTRE GROUP ─────────────────────────────────── -->
      <g id="center-group">

        <g clip-path="url(#circle-clip)">
          <foreignObject x="760" y="340" width="400" height="400">
            <video xmlns="http://www.w3.org/1999/xhtml"
              id="spine-video"
              autoplay muted loop playsinline
              width="400" height="400">
              <source src="../ressources%20videos%20%26%20pdf/Decompressions.mp4"
                      type="video/mp4"/>
            </video>
          </foreignObject>
        </g>

        <circle id="center-vignette"
          cx="960" cy="540" r="200"
          fill="url(#vignette-grad)"
          pointer-events="none"/>

      </g>

    </svg>

    <!-- ── END FRAME ─────────────────────────────────────── -->
    <div id="end-frame">
      <p id="end-title">SyncAR Spine<span id="end-cursor">|</span></p>
      <p id="end-subtitle">Across the Entire Continuum of Care</p>
    </div>

  </div><!-- /#scene -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/animation.js"></script>

  <!-- ── Toggle background: black ↔ transparent (for alpha export) ── -->
  <button id="bg-toggle" title="Toggle black / transparent background for OBS alpha recording">⬛ BG : BLACK</button>
  <script>
    (function () {
      let isBlack = true;
      const btn  = document.getElementById('bg-toggle');
      const root = document.documentElement;

      btn.addEventListener('click', function () {
        isBlack = !isBlack;
        const bg = isBlack ? '#000000' : 'transparent';
        root.style.background  = bg;
        document.body.style.background = bg;
        btn.textContent = isBlack ? '⬛ BG : BLACK' : '◻ BG : TRANSPARENT';
        btn.classList.toggle('is-transparent', !isBlack);
      });
    }());
  </script>

</body>
</html>
