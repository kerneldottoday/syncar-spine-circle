<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncAR Spine — Surgical Theater</title>

  <!-- Montserrat replaces Inter for all display text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* ── Toggle background button ── */
    #bg-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 9999;
      background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.18); padding: 7px 16px;
      font-family: 'Montserrat', sans-serif; font-size: 10px;
      font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border-radius: 3px;
      transition: background 0.2s, color 0.2s; user-select: none;
    }
    #bg-toggle:hover { background: rgba(255,255,255,0.14); color: #ffffff; }
    #bg-toggle.is-transparent { border-color: rgba(255,255,255,0.45); color: #ffffff; }
  </style>
</head>
<body>

  <div id="scene">

    <!-- ── PARTICLE LAYER ──────────────────────────────────── -->
    <canvas id="bg-particles"></canvas>

    <!-- ── SVG DIAGRAM ──────────────────────────────────────── -->
    <!--
      Circle geometry — client update v3
        Canvas      : 1920 × 1080   Centre: (960, 540)
        Outer r     : 500px
        Inner r     : 350px   →  Ring : 150px  (−40% from v2)
        Text/Sweep r: 425px   (midline of new ring)
        Gap : 5°  /  Span : 115°

      Segments (by new name):
        Seg 1  Surgical Planning       :  2.5° → 117.5°  (upper-right)
        Seg 2  Intraoperative Execution: 122.5° → 237.5°  (bottom)
        Seg 3  Patient Engagement      : 242.5° → 357.5°  (upper-left)
    -->
    <svg id="diagram"
         viewBox="0 0 1920 1080"
         width="1920" height="1080"
         overflow="visible"
         xmlns="http://www.w3.org/2000/svg">

      <defs>

        <!-- ── Glow filters ── -->
        <filter id="glow-red" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="20"
            flood-color="#E8163A" flood-opacity="0.9"/>
        </filter>
        <filter id="glow-purple" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="18"
            flood-color="#9B30FF" flood-opacity="0.85"/>
        </filter>
        <filter id="glow-gold" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="20"
            flood-color="#F0B400" flood-opacity="0.9"/>
        </filter>

        <!-- ── Segment active gradients (userSpaceOnUse, 1920×1080) ── -->

        <!-- Surgical Planning: orange→red (upper-right diagonal) -->
        <linearGradient id="grad-surgical"
          x1="978" y1="115" x2="1337" y2="736"
          gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#E85D04"/>
          <stop offset="100%" stop-color="#E8163A"/>
        </linearGradient>

        <!-- Patient Engagement: plum→purple (upper-left diagonal) -->
        <linearGradient id="grad-patient"
          x1="583" y1="736" x2="941" y2="115"
          gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#6B2D8B"/>
          <stop offset="100%" stop-color="#9B30FF"/>
        </linearGradient>

        <!-- Intraoperative Execution: gold→yellow (horizontal) -->
        <linearGradient id="grad-intraop"
          x1="602" y1="768" x2="1318" y2="768"
          gradientUnits="userSpaceOnUse">
          <stop offset="0%"   stop-color="#F0B400"/>
          <stop offset="100%" stop-color="#FFE566"/>
        </linearGradient>

        <!-- Circular clip for centre video  r=340 -->
        <clipPath id="circle-clip">
          <circle cx="960" cy="540" r="340"/>
        </clipPath>

        <!-- Vignette gradient for centre circle -->
        <radialGradient id="vignette-grad" cx="50%" cy="50%" r="50%">
          <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
        </radialGradient>

        <!-- ══════════════════════════════════════════════════
             Gap mask  outer r=504  inner r=344
             6° wedges at 0° (top), 120° (right), 240° (left)
             ══════════════════════════════════════════════════ -->
        <mask id="ring-gaps-mask">
          <rect x="0" y="0" width="1920" height="1080" fill="white"/>

          <!-- Gap A  top  357°→3° -->
          <path fill="black"
            d="M 933.62,36.70 A 504,504 0 0,1 986.38,36.70
               L 978.00,196.47 A 344,344 0 0,0 942.00,196.47 Z"/>

          <!-- Gap B  right  117°→123° -->
          <path fill="black"
            d="M 1409.06,768.82 A 504,504 0 0,1 1382.68,814.50
               L 1248.50,727.35 A 344,344 0 0,0 1266.51,696.17 Z"/>

          <!-- Gap C  left  237°→243° -->
          <path fill="black"
            d="M 537.32,814.50 A 504,504 0 0,1 510.94,768.82
               L 653.49,696.17 A 344,344 0 0,0 671.50,727.35 Z"/>
        </mask>

        <!-- ══════════════════════════════════════════════════
             Text-path arcs  r=425  (new ring midline)
             tpath-1: CW  2.5°→117.5°  Surgical Planning
             tpath-2: CCW 237.5°→122.5° Intraoperative Execution
             tpath-3: CW  242.5°→357.5° Patient Engagement
             ══════════════════════════════════════════════════ -->

        <!-- tpath-1  CW  2.5°→117.5°  (SURGICAL PLANNING — readable L→R) -->
        <path id="tpath-1"
          d="M 978.54,115.41 A 425,425 0 0,1 1336.98,736.24"/>

        <!-- tpath-2  CCW  237.5°→122.5°  (INTRAOPERATIVE EXECUTION — L→R through bottom) -->
        <path id="tpath-2"
          d="M 601.56,768.35 A 425,425 0 0,0 1318.44,768.35"/>

        <!-- tpath-3  CW  242.5°→357.5°  (PATIENT ENGAGEMENT — readable upward) -->
        <path id="tpath-3"
          d="M 583.02,736.24 A 425,425 0 0,1 941.46,115.41"/>

      </defs>

      <!-- ══════════════════════════════════════════════════════
           ARC SEGMENTS  outer r=500  inner r=350  ring=150px
           ══════════════════════════════════════════════════════ -->
      <g mask="url(#ring-gaps-mask)">

      <!-- Seg 1 — Surgical Planning  (2.5° → 117.5°)  upper-right -->
      <path id="seg-1" class="segment"
        d="M 981.82,40.48
           A 500,500 0 0,1 1403.50,770.86
           L 1270.45,701.61
           A 350,350 0 0,0  975.27,190.33
           Z"
        fill="#3a1500"
        data-mute="#3a1500"
        data-active="url(#grad-surgical)"
        data-filter="glow-red"
        cursor="pointer"/>

      <!-- Seg 2 — Intraoperative Execution  (122.5° → 237.5°)  bottom -->
      <path id="seg-2" class="segment"
        d="M 1381.70,808.66
           A 500,500 0 0,1  538.30,808.66
           L  664.81,728.06
           A 350,350 0 0,0 1255.19,728.06
           Z"
        fill="#3d2a00"
        data-mute="#3d2a00"
        data-active="url(#grad-intraop)"
        data-filter="glow-gold"
        cursor="pointer"/>

      <!-- Seg 3 — Patient Engagement  (242.5° → 357.5°)  upper-left -->
      <path id="seg-3" class="segment"
        d="M  516.50,770.86
           A 500,500 0 0,1  938.18,40.48
           L  944.73,190.33
           A 350,350 0 0,0  649.55,701.61
           Z"
        fill="#2a0a40"
        data-mute="#2a0a40"
        data-active="url(#grad-patient)"
        data-filter="glow-purple"
        cursor="pointer"/>

      </g><!-- /ring-gaps-mask -->

      <!-- ── GAP COVERS — belt-and-suspenders black fills ── -->
      <path class="gap-cover"
        d="M 933.62,36.70 A 504,504 0 0,1 986.38,36.70
           L 978.00,196.47 A 344,344 0 0,0 942.00,196.47 Z"/>
      <path class="gap-cover"
        d="M 1409.06,768.82 A 504,504 0 0,1 1382.68,814.50
           L 1248.50,727.35 A 344,344 0 0,0 1266.51,696.17 Z"/>
      <path class="gap-cover"
        d="M 537.32,814.50 A 504,504 0 0,1 510.94,768.82
           L 653.49,696.17 A 344,344 0 0,0 671.50,727.35 Z"/>

      <!-- ── ARC LABELS ─────────────────────────────────────── -->
      <text class="arc-label" id="label-1">
        <textPath href="#tpath-1" startOffset="50%" text-anchor="middle">SURGICAL PLANNING</textPath>
      </text>

      <text class="arc-label" id="label-2">
        <textPath href="#tpath-2" startOffset="50%" text-anchor="middle">INTRAOPERATIVE EXECUTION</textPath>
      </text>

      <text class="arc-label" id="label-3">
        <textPath href="#tpath-3" startOffset="50%" text-anchor="middle">PATIENT ENGAGEMENT</textPath>
      </text>

      <!-- ══════════════════════════════════════════════════════
           ARC SWEEP OVERLAYS  r=425  stroke-width=145  dasharray=145 708
           ══════════════════════════════════════════════════════ -->

      <!-- sweep-1  CW  2.5°→117.5° -->
      <path id="sweep-1" class="arc-sweep"
        d="M 978.54,115.41 A 425,425 0 0,1 1336.98,736.24"
        stroke-dasharray="145 708" stroke-dashoffset="145"/>

      <!-- sweep-2  CW  122.5°→237.5° -->
      <path id="sweep-2" class="arc-sweep"
        d="M 1318.44,768.35 A 425,425 0 0,1 601.56,768.35"
        stroke-dasharray="145 708" stroke-dashoffset="145"/>

      <!-- sweep-3  CW  242.5°→357.5° -->
      <path id="sweep-3" class="arc-sweep"
        d="M 583.02,736.24 A 425,425 0 0,1 941.46,115.41"
        stroke-dasharray="145 708" stroke-dashoffset="145"/>

      <!-- ── CENTRE GROUP ─────────────────────────────────── -->
      <g id="center-group">

        <g id="center-spin" clip-path="url(#circle-clip)">
          <foreignObject x="620" y="200" width="680" height="680">
            <video xmlns="http://www.w3.org/1999/xhtml"
              id="spine-video"
              autoplay muted loop playsinline
              width="680" height="680">
              <source src="media/Decompressions.mp4"
                      type="video/mp4"/>
            </video>
          </foreignObject>
        </g>

        <circle id="center-vignette"
          cx="960" cy="540" r="340"
          fill="url(#vignette-grad)"
          pointer-events="none"/>

      </g>

    </svg>

    <!-- ── SEGMENT BANNERS (appear when each segment activates) ── -->
    <div id="banner-patient" class="segment-banner">PATIENT ENGAGEMENT</div>
    <div id="banner-surgical" class="segment-banner">SURGICAL PLANNING</div>
    <div id="banner-intraop" class="segment-banner">INTRAOPERATIVE EXECUTION</div>

    <!-- ── END FRAME ─────────────────────────────────────── -->
    <div id="end-frame">
      <p id="end-title">SyncAR Spine<span id="end-cursor">|</span></p>
      <p id="end-subtitle">Across the Entire Continuum of Care</p>
      <p id="end-company">Surgical Theater</p>
    </div>

  </div><!-- /#scene -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/animation.js"></script>

  <!-- ── Toggle background: black ↔ transparent ── -->
  <button id="bg-toggle" title="Toggle black / transparent background">⬛ BG : BLACK</button>
  <script>
    (function () {
      let isBlack = true;
      const btn  = document.getElementById('bg-toggle');
      const root = document.documentElement;
      btn.addEventListener('click', function () {
        isBlack = !isBlack;
        const bg = isBlack ? '#000000' : 'transparent';
        root.style.background  = bg;
        document.body.style.background = bg;
        btn.textContent = isBlack ? '⬛ BG : BLACK' : '◻ BG : TRANSPARENT';
        btn.classList.toggle('is-transparent', !isBlack);
      });
    }());
  </script>

</body>
</html>
