<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncAR Spine — Alpha Export</title>

  <!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  ALPHA VERSION — for OBS WebM recording with alpha channel   ║
  ║                                                              ║
  ║  OBS Setup:                                                  ║
  ║  1. Add a "Browser Source" pointing to this file             ║
  ║     (or serve via http://localhost:8765/syncar-circle/       ║
  ║      index-alpha.html)                                       ║
  ║  2. Check "Allow transparency" in the Browser Source         ║
  ║     settings                                                 ║
  ║  3. Record output as WebM (VP8/VP9 with alpha support)       ║
  ║  4. The background will be fully transparent —               ║
  ║     only the diagram, text and glow will be captured         ║
  ╚══════════════════════════════════════════════════════════════╝
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />

  <!-- Force fully transparent background — overrides styles.css #000000 -->
  <style>
    html, body {
      background: transparent !important;
    }
  </style>
</head>
<body>

  <div id="scene">

    <!-- ── PARTICLE LAYER ──────────────────────────────────── -->
    <canvas id="bg-particles"></canvas>

    <svg id="diagram"
         viewBox="0 0 1920 1080"
         width="1920" height="1080"
         overflow="visible"
         xmlns="http://www.w3.org/2000/svg">

      <defs>

        <!-- Glow filters (same as black version) -->
        <filter id="glow-red" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="20"
            flood-color="#E8163A" flood-opacity="0.9"/>
        </filter>
        <filter id="glow-purple" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="18"
            flood-color="#9B30FF" flood-opacity="0.85"/>
        </filter>
        <filter id="glow-gold" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="20"
            flood-color="#F0B400" flood-opacity="0.9"/>
        </filter>

        <!-- Circular clip for centre video  r=200 (2× original 100) -->
        <clipPath id="circle-clip">
          <circle cx="960" cy="540" r="200"/>
        </clipPath>

        <!-- Vignette: fully transparent in alpha mode -->
        <radialGradient id="vignette-grad" cx="50%" cy="50%" r="50%">
          <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <!-- Text-path arcs  r = 424  (2× original 212) -->
        <!-- tpath-1: CCW 27.5°→272.5° — PRE-OPERATIVE chars face upward -->
        <path id="tpath-1"
          d="M 1336.10,735.78 A 424,424 0 0,0 978.50,116.40"/>
        <path id="tpath-2"
          d="M 602.40,767.82 A 424,424 0 0,0 1317.60,767.82"/>
        <path id="tpath-3"
          d="M 583.90,735.78 A 424,424 0 0,1 941.50,116.40"/>

        <!-- Gap mask — 6° wedges  r_outer=504  r_inner=246  (2× scale) -->
        <mask id="ring-gaps-mask">
          <rect x="0" y="0" width="1920" height="1080" fill="white"/>
          <!-- Gap A  top  267°→273° -->
          <path fill="black"
            d="M 933.62,36.70 A 504,504 0 0,1 986.38,36.70
               L 972.88,294.34 A 246,246 0 0,0 947.12,294.34 Z"/>
          <!-- Gap B  right  27°→33° -->
          <path fill="black"
            d="M 1409.06,768.82 A 504,504 0 0,1 1382.68,814.50
               L 1166.32,673.98 A 246,246 0 0,0 1179.18,651.68 Z"/>
          <!-- Gap C  left  147°→153° -->
          <path fill="black"
            d="M 537.32,814.50 A 504,504 0 0,1 510.94,768.82
               L 740.82,651.68 A 246,246 0 0,0 753.68,673.98 Z"/>
        </mask>

      </defs>

      <!-- ARC SEGMENTS  outer r=500  inner r=250  ring=250px  (2× scale) -->
      <g mask="url(#ring-gaps-mask)">

      <path id="seg-1" class="segment"
        d="M 981.82,40.48
           A 500,500 0 0,1 1403.50,770.86
           L 1181.76,655.44
           A 250,250 0 0,0  970.90,290.24
           Z"
        fill="#4d1020"
        data-mute="#4d1020"
        data-active="#E8163A"
        data-filter="glow-red"
        cursor="pointer"/>

      <path id="seg-2" class="segment"
        d="M 1381.70,808.66
           A 500,500 0 0,1  538.30,808.66
           L  749.16,674.32
           A 250,250 0 0,0 1170.84,674.32
           Z"
        fill="#2e1260"
        data-mute="#2e1260"
        data-active="#9B30FF"
        data-filter="glow-purple"
        cursor="pointer"/>

      <path id="seg-3" class="segment"
        d="M  516.50,770.86
           A 500,500 0 0,1  938.18,40.48
           L  949.10,290.24
           A 250,250 0 0,0  738.24,655.44
           Z"
        fill="#3d3000"
        data-mute="#3d3000"
        data-active="#F0B400"
        data-filter="glow-gold"
        cursor="pointer"/>

      </g><!-- /ring-gaps-mask -->

      <!-- ARC LABELS -->
      <text class="arc-label" id="label-1">
        <textPath href="#tpath-1" startOffset="50%" text-anchor="middle">PRE-OPERATIVE</textPath>
      </text>
      <text class="arc-label" id="label-2">
        <textPath href="#tpath-2" startOffset="50%" text-anchor="middle">PATIENT ENGAGEMENT</textPath>
      </text>
      <text class="arc-label" id="label-3">
        <textPath href="#tpath-3" startOffset="50%" text-anchor="middle">INTRA-OPERATIVE</textPath>
      </text>

      <!-- ARC SWEEP OVERLAYS  r=376 (2×188)  dasharray 130+624=754 -->
      <path id="sweep-1" class="arc-sweep"
        d="M 976.40,164.36 A 376,376 0 0,1 1293.52,713.62"
        stroke-dasharray="130 624" stroke-dashoffset="130"/>
      <path id="sweep-2" class="arc-sweep"
        d="M 1277.12,742.02 A 376,376 0 0,1 642.88,742.02"
        stroke-dasharray="130 624" stroke-dashoffset="130"/>
      <path id="sweep-3" class="arc-sweep"
        d="M 626.48,713.62 A 376,376 0 0,1 943.60,164.36"
        stroke-dasharray="130 624" stroke-dashoffset="130"/>

      <!-- CENTRE GROUP -->
      <g id="center-group">
        <g clip-path="url(#circle-clip)">
          <foreignObject x="760" y="340" width="400" height="400">
            <video xmlns="http://www.w3.org/1999/xhtml"
              id="spine-video"
              autoplay muted loop playsinline
              width="400" height="400">
              <source src="media/Decompressions.mp4"
                      type="video/mp4"/>
            </video>
          </foreignObject>
        </g>
        <!-- Vignette: transparent in alpha mode -->
        <circle id="center-vignette"
          cx="960" cy="540" r="200"
          fill="url(#vignette-grad)"
          pointer-events="none"/>
      </g>

    </svg>

    <!-- END FRAME -->
    <div id="end-frame">
      <p id="end-title">SyncAR Spine<span id="end-cursor">|</span></p>
      <p id="end-subtitle">Across the Entire Continuum of Care</p>
    </div>

  </div><!-- /#scene -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/animation.js"></script>

</body>
</html>
